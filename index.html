<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mera Voice AI</title>
<style>
body {
  margin: 0;
  padding: 25px 16px;
  font-family: Arial, sans-serif;
  background: #101124;
  color: white;
  text-align: center;
}
h1 { color: #c8baff; }
.orb {
  width: 145px;
  height: 145px;
  margin: 35px auto;
  border-radius: 50%;
  background: radial-gradient(circle, #ff9de2, #7865ff 55%, #090dff);
  box-shadow: 0 0 45px #7766ff;
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  from { transform: scale(1); }
  to { transform: scale(1.07); }
}
button {
  border: 0;
  border-radius: 28px;
  padding: 15px 23px;
  margin: 8px;
  font-size: 16px;
  background: #7865ff;
  color: white;
}
input {
  box-sizing: border-box;
  width: 95%;
  padding: 14px;
  border-radius: 12px;
  border: 0;
  margin: 12px 0;
  font-size: 16px;
}
#status {
  margin: 20px auto;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<h1>✨ Mera Voice AI</h1>
<p>Tumhara apna personal AI dost</p>
<div class="orb"></div>

<input id="question" placeholder="Yahan apna sawaal likho..." />
<br>
<button onclick="askAI()">Poochho</button>
<button onclick="listen()">🎙️ Bolo</button>
<button onclick="speakWelcome()">🔊 AI ko suno</button>

<div id="status">Namaste dost! Mujhse kuch bhi poochho.</div>

<script>
const WORKER_URL = "https://damp-meadow-1f03.2808architavishwakarma.workers.dev/";

function show(text) {
  document.getElementById("status").textContent = text;
}


function speak(text) {
if (!("speechSynthesis" in window)) {
show("Browser voice support nahi kar raha. Chrome update karo.");
return;
}

const synth = window.speechSynthesis;
synth.cancel();

function speakWithVoice() {
const voices = synth.getVoices();
const hindiVoices = voices.filter(v =>
/^hi([-_]|$)/i.test(v.lang)
);

const femaleVoice = hindiVoices.find(v =>
  /female|woman|महिला|google.*hindi|google.*हिन्दी/i.test(v.name)
);

const msg = new SpeechSynthesisUtterance(text);
msg.lang = "hi-IN";
msg.rate = 0.9;
msg.pitch = 1.15;

if (femaleVoice) {
  msg.voice = femaleVoice;
}

synth.speak(msg);

}

if (synth.getVoices().length > 0) {
speakWithVoice();
} else {
synth.onvoiceschanged = () => {
synth.onvoiceschanged = null;
speakWithVoice();
};
}
}
  

function speakWelcome() {
  speak("Namaste dost! Main tumhara Mera Voice AI hoon. Batao, kya poochhna hai?");
}

async function askAI() {
  const question = document.getElementById("question").value.trim();
  if (!question) {
    show("Pehle apna sawaal likho ya Bolo button dabao.");
    return;
  }

  if (WORKER_URL.includes("YAHAN_APNA")) {
    show("Pehle code mein apna Cloudflare Worker URL lagao.");
    return;
  }

  show("Soch raha hoon, dost...");
  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: question })
    });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI se jawab nahi mila.");
    }

    const reply = data.reply || "Maaf karna, jawab nahi mila.";
    show(reply);
    speak(reply);
  } catch (error) {
    show("Dikkat: " + error.message);
  }
}

function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    show("Voice typing ke liye Android Chrome mein microphone permission do, ya sawaal type karo.");
    return;
  }

  const recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.onstart = () => show("Sun raha hoon, bolo dost...");
  recognition.onresult = (event) => {
    const words = event.results[0][0].transcript;
    document.getElementById("question").value = words;
    askAI();
  };
  recognition.onerror = () => show("Awaaz sunne mein dikkat hui. Dobara koshish karo ya type karo.");
  recognition.start();
}
</script>
</body>
</html>
